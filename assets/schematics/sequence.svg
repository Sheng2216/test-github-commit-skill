<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#f7f9fc"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" fill="#1f2d3d">请求时序原理图（Request Sequence）</text>

  <!-- 泳道 -->
  <line x1="120" y1="50" x2="120" y2="280" stroke="#cbd5e0"/>
  <line x1="320" y1="50" x2="320" y2="280" stroke="#cbd5e0"/>
  <line x1="520" y1="50" x2="520" y2="280" stroke="#cbd5e0"/>
  <text x="120" y="44" text-anchor="middle" font-size="13" fill="#2b6cb0">撰写者</text>
  <text x="320" y="44" text-anchor="middle" font-size="13" fill="#319795">文档网关</text>
  <text x="520" y="44" text-anchor="middle" font-size="13" fill="#dd8a31">内容服务</text>

  <line x1="120" y1="80" x2="315" y2="80" stroke="#4a5568" stroke-width="2" marker-end="url(#b)"/>
  <text x="200" y="74" text-anchor="middle" font-size="12" fill="#4a5568">提交文档</text>

  <line x1="320" y1="120" x2="515" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#b)"/>
  <text x="410" y="114" text-anchor="middle" font-size="12" fill="#4a5568">鉴权 + 写入版本</text>

  <line x1="520" y1="160" x2="325" y2="160" stroke="#4a5568" stroke-width="2" marker-end="url(#b)"/>
  <text x="420" y="154" text-anchor="middle" font-size="12" fill="#4a5568">返回版本号</text>

  <line x1="320" y1="200" x2="125" y2="200" stroke="#4a5568" stroke-width="2" marker-end="url(#b)"/>
  <text x="220" y="194" text-anchor="middle" font-size="12" fill="#4a5568">返回版本号</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a5568"/>
    </marker>
  </defs>
</svg>
